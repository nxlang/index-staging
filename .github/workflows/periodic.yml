# The periodic check (nxpkg spec 5.10 rule 6): every URL of every built package and
# source mirror downloaded and checksummed, and every git source's tag, with `nxpkg
# index check --remote` -- each week the whole mirror too, which covers the monthly
# check. Its report is the run's summary, kept 90 days; then .github/scripts/report.sh:
# one issue per package with a problem, addressed to its owners, closed once fixed;
# after four weeks, an original URL that a mirror backs is removed from `urls`.
#
# Inactive until the repository variable NEXUS_TOOLCHAIN_URL is set (see check.yml).
name: periodic
on:
  schedule:
    - cron: "17 4 * * 1"     # every Monday, 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  remote:
    if: vars.NEXUS_TOOLCHAIN_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nexus-toolchain
      - name: nxpkg index check --remote
        id: remote
        run: |
          set +e
          nxpkg index check . --remote >report.txt 2>&1
          echo "status=$?" >>"$GITHUB_OUTPUT"
          { echo '## Periodic check'; echo '```'; cat report.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.txt
          retention-days: 90
      - name: Issues, and the URLs gone four weeks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          gh label create periodic -R "$REPO" --color d93f0b --description "The periodic check found a problem" --force >/dev/null
          sh .github/scripts/report.sh report.txt
          if ! git diff --quiet; then
            git config user.name "nxlang-index"
            git config user.email "nxlang-index@users.noreply.github.com"
            git commit -qam "periodic: an original URL gone four weeks removed (the mirror remains)"
            nxpkg index check . --base HEAD~1
            git push origin HEAD:main
          fi

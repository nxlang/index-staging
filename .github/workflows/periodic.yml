# The periodic check (nxpkg spec 5.10 rule 6): every original URL of every built
# package and source mirror, and every git source's tag, with `nxpkg index check
# --remote`; its report published as the run's summary and kept 90 days; a problem
# opens (or updates) an issue.
#
# Inactive until the repository variable NEXUS_TOOLCHAIN_URL is set (see check.yml).
# Not yet: the issue addressed to each package's owners, and the removal of an
# original URL after four weeks without a fix (rule 6), the monthly check of the mirror.
name: periodic
on:
  schedule:
    - cron: "17 4 * * 1"     # every Monday, 04:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  remote:
    if: vars.NEXUS_TOOLCHAIN_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/nexus-toolchain
      - name: nxpkg index check --remote
        id: remote
        run: |
          set +e
          nxpkg index check . --remote >report.txt 2>&1
          echo "status=$?" >>"$GITHUB_OUTPUT"
          { echo '## Periodic check'; echo '```'; cat report.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.txt
          retention-days: 90
      - name: Open or update the issue
        if: steps.remote.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Periodic check: a URL or a tag is not ok"
          body="$(printf 'The periodic check of %s found problems (%s):\n\n```\n%s\n```\n' "$(date -u +%F)" "$RUN" "$(grep -v '^ok ' report.txt)")"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
